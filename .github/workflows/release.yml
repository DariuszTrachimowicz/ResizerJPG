name: Test and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $meta = Get-Content AppInfo.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v' + $meta.version)) { throw 'Tag and version differ.' }
      - name: Test resize engine
        shell: powershell
        run: ./tests/Test-Resizer.ps1
      - name: Test photo queue and desktop models
        shell: powershell
        run: |
          ./tests/Test-Queue.ps1
          ./tests/Test-UIModels.ps1
          ./tests/Test-WindowLayout.ps1
      - name: Test WPF icon geometry and pixels
        shell: powershell
        run: ./tests/Test-Icons.ps1
      - name: Test local help and GPL license
        shell: powershell
        run: |
          ./tests/Test-HelpLicense.ps1
      - name: Build portable package
        shell: powershell
        run: ./Build-Portable.ps1
      - name: Test update package and installer
        shell: powershell
        run: |
          ./tests/Test-Updates.ps1
          ./tests/Test-PortableCompatibility.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ResizerJPG-portable
          path: |
            ResizerJPG_portable.zip
            ResizerJPG_portable.zip.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ResizerJPG_portable.zip ResizerJPG_portable.zip.sha256 --title "Resizer JPG $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
